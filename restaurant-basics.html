<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ServeUp - Restaurant Basics</title>

  <style>
.feedback-title {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 15px;
}

.feedback-icon {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 18px;
    font-weight: 700;
}

.feedback-icon.correct {
    background: #5b9b63;
}

.feedback-icon.wrong {
    background: #c96b6b;
}
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: #f7f7f5;
        color: #222;
    }

    .container {
        max-width: 900px;
        margin: 0 auto;
        padding: 50px 25px;
    }

    .header {
        text-align: center;
        margin-bottom: 50px;
    }

    .logo {
        font-size: 48px;
        letter-spacing: 10px;
        font-weight: 700;
        margin-bottom: 10px;
    }

    .subtitle {
        font-size: 22px;
        color: #777;
    }

    .progress {
        color: #777;
        font-size: 18px;
        margin-bottom: 25px;
    }

    .question {
        font-size: 30px;
        line-height: 1.4;
        margin-bottom: 30px;
    }

    .answers {
        display: flex;
        flex-direction: column;
        gap: 14px;
    }

    .answer {
        width: 100%;
        padding: 20px;
        border: 1px solid #ddd;
        border-radius: 14px;
        background: white;
        text-align: left;
        font-size: 18px;
        cursor: pointer;
        transition: 0.2s;
    }

    .answer:hover {
        background: #f0f0ee;
    }

    .answer.selected {
        border: 2px solid #555;
    }

    .answer.correct {
        background: #edf7ed;
        border: 2px solid #75a875;
    }

    .answer.wrong {
        background: #fbeeee;
        border: 2px solid #c77;
    }

    .feedback {
        display: none;
        margin-top: 30px;
        padding: 25px;
        background: white;
        border-radius: 16px;
        border: 1px solid #ddd;
    }

    .feedback h3 {
        margin-top: 0;
        font-size: 24px;
    }

    .feedback p {
        font-size: 17px;
        line-height: 1.6;
        color: #555;
    }

    .key-point {
        margin-top: 18px;
        padding: 15px;
        background: #f3f3f1;
        border-radius: 10px;
        font-weight: 600;
    }

    .next-button {
        width: 100%;
        margin-top: 25px;
        padding: 18px;
        border: none;
        border-radius: 12px;
        background: #222;
        color: white;
        font-size: 18px;
        cursor: pointer;
    }

    .next-button:hover {
        background: #444;
    }

    .result {
        display: none;
        text-align: center;
        background: white;
        padding: 45px 25px;
        border-radius: 20px;
        border: 1px solid #ddd;
    }

    .result h2 {
        font-size: 42px;
        margin-bottom: 20px;
    }

    .score {
        font-size: 70px;
        font-weight: 700;
        margin: 20px 0;
    }

    .result p {
        font-size: 19px;
        color: #666;
        line-height: 1.6;
    }

    .retry {
        display: inline-block;
        margin-top: 25px;
        padding: 16px 35px;
        background: #222;
        color: white;
        text-decoration: none;
        border-radius: 10px;
        font-size: 18px;
    }

    @media (max-width: 600px) {
        .container {
            padding: 30px 18px;
        }

        .logo {
            font-size: 36px;
        }

        .question {
            font-size: 24px;
        }

        .answer {
            font-size: 16px;
        }
    }
</style>
</head>

<body>

  <div class="container">

    <div class="header">
      <div class="logo">SERVEUP</div>

      <div class="tagline">
        Restaurant Training Made Simple
      </div>

      <div class="subtitle">
        Restaurant Basics
      </div>
    </div>


    <div class="progress" id="progress">
      Question 1 / 10
    </div>


    <div class="card">

      <div id="quiz">

        <h2 class="question" id="question"></h2>

        <div id="answers"></div>

<div id="feedback" class="feedback">
    <div class="feedback-title">
        <span id="feedbackIcon" class="feedback-icon"></span>
        <span id="feedbackTitleText"></span>
    </div>

    <div id="feedbackText" class="feedback-message"></div>

    <div id="keyPoint" class="key-point"></div>
</div>
        <button
          id="nextButton"
          class="next-button"
          onclick="nextQuestion()">
          Next Question →
        </button>

      </div>


      <div id="result" class="result">

        <h2>Training Complete</h2>

        <div class="score" id="score"></div>

        <div class="passed">
          <h3>Passed! ✓</h3>

          <p>
            You have successfully completed the Restaurant Basics training.
            Keep applying these principles in your daily work.
          </p>
        </div>

        <a class="back-button" href="index.html">
          Back to Training
        </a>

      </div>

    </div>


    <footer>
      © 2026 ServeUp
    </footer>

  </div>


  <script>

    const questions = [

      {
        question: "What should you do first when you arrive for your shift?",
        answers: [
          "Start working immediately without checking anything.",
          "Check your appearance, prepare yourself and be ready for work.",
          "Wait until someone tells you what to do.",
          "Go directly to the dining area and sit down."
        ],
        correct: 1,
        explanation:
          "Being prepared before the shift helps the team start smoothly and professionally."
      },

      {
        question: "What is the most important thing when speaking with a customer?",
        answers: [
          "Speak as quickly as possible.",
          "Avoid eye contact.",
          "Speak politely and clearly.",
          "Only speak when the customer asks a question."
        ],
        correct: 2,
        explanation:
          "Clear and polite communication helps customers feel comfortable and respected."
      },

      {
        question: "What should you do when you enter the service area?",
        answers: [
          "Check the area and make sure everything is ready.",
          "Wait for another employee.",
          "Ignore the area.",
          "Immediately leave the area."
        ],
        correct: 0,
        explanation:
          "Checking your work area helps prevent problems and keeps service running smoothly."
      },

      {
        question: "Why is teamwork important in a restaurant?",
        answers: [
          "It allows employees to avoid communication.",
          "It helps everyone work together efficiently.",
          "It means only managers are responsible.",
          "It allows employees to work separately."
        ],
        correct: 1,
        explanation:
          "Good teamwork improves communication, efficiency and the customer experience."
      },

      {
        question: "What should you do if you do not understand an instruction?",
        answers: [
          "Ignore it.",
          "Guess what to do.",
          "Ask for clarification.",
          "Wait until the end of the shift."
        ],
        correct: 2,
        explanation:
          "Asking for clarification is better than making a mistake because you misunderstood an instruction."
      },

      {
        question: "How should restaurant equipment be treated?",
        answers: [
          "Use it carefully and according to instructions.",
          "Use it however you want.",
          "Leave it dirty after use.",
          "Only managers need to care about equipment."
        ],
        correct: 0,
        explanation:
          "Proper use and care of equipment helps maintain safety and efficiency."
      },

      {
        question: "What should you do when your work area becomes messy?",
        answers: [
          "Leave it until the end of the day.",
          "Ask a customer to clean it.",
          "Clean and organize it as soon as possible.",
          "Ignore it if customers cannot see it."
        ],
        correct: 2,
        explanation:
          "Keeping the work area clean and organized supports safe and efficient service."
      },

      {
        question: "What should you do if you make a mistake during service?",
        answers: [
          "Hide the mistake.",
          "Blame another employee.",
          "Report it and take appropriate action.",
          "Ignore it."
        ],
        correct: 2,
        explanation:
          "Being honest about mistakes allows the team to solve problems quickly and professionally."
      },

      {
        question: "What is a good way to support your coworkers?",
        answers: [
          "Help when appropriate and communicate clearly.",
          "Only focus on yourself.",
          "Avoid speaking with coworkers.",
          "Wait until someone asks for help."
        ],
        correct: 0,
        explanation:
          "Supporting coworkers helps the whole team provide better service."
      },

      {
        question: "What is the main goal of restaurant service?",
        answers: [
          "Finish work as quickly as possible.",
          "Provide a safe, professional and positive experience for customers.",
          "Avoid speaking with customers.",
          "Only focus on completing individual tasks."
        ],
        correct: 1,
        explanation:
          "Professional restaurant service is about providing customers with a safe, welcoming and positive experience."
      }

    ];


    let currentQuestion = 0;
    let score = 0;
    let answered = false;


    function showQuestion() {

      answered = false;

      const q = questions[currentQuestion];

      document.getElementById("progress").textContent =
        "Question " + (currentQuestion + 1) + " / " + questions.length;

      document.getElementById("question").textContent =
        q.question;

      const answersDiv =
        document.getElementById("answers");

      answersDiv.innerHTML = "";

      q.answers.forEach(function(answer, index) {

        const button = document.createElement("button");

        button.className = "answer";

        button.textContent = answer;

        button.onclick = function() {
          selectAnswer(index, button);
        };

        answersDiv.appendChild(button);

      });

      document.getElementById("feedback").className =
        "feedback";

      document.getElementById("feedbackTitle").textContent = "";

      document.getElementById("feedbackText").textContent = "";

      document.getElementById("nextButton").style.display =
        "none";
    }


    function selectAnswer(index, button) {

      if (answered) {
        return;
      }

      answered = true;

      const q = questions[currentQuestion];

      const allAnswers =
        document.querySelectorAll(".answer");

      allAnswers.forEach(function(answer) {
        answer.disabled = true;
      });


      if (index === q.correct) {

        score++;

        button.classList.add("correct");

        document.getElementById("feedback").className =
          "feedback correct";
document.getElementById("feedbackIcon").textContent = "✓";
        document.getElementById("feedbackTitleText").textContent =
          "Correct!";

      } else {

        button.classList.add("incorrect");

        allAnswers[q.correct].classList.add("correct");

        document.getElementById("feedback").className =
          "feedback incorrect";
document.getElementById("feedbackIcon").textContent = "×";
        document.getElementById("feedbackTitleText").textContent =
          "Incorrect";

      }


      document.getElementById("feedbackText").textContent =
        q.explanation;


      if (currentQuestion < questions.length - 1) {

        document.getElementById("nextButton").style.display =
          "inline-block";

      } else {

        document.getElementById("nextButton").textContent =
          "View Result →";

        document.getElementById("nextButton").style.display =
          "inline-block";
      }
    }


    function nextQuestion() {

      currentQuestion++;

      if (currentQuestion < questions.length) {

        showQuestion();

        window.scrollTo({
          top: 0,
          behavior: "smooth"
        });

      } else {

        showResult();

      }
    }


    function showResult() {

      document.getElementById("quiz").style.display =
        "none";

      document.getElementById("progress").style.display =
        "none";

      document.getElementById("result").style.display =
        "block";


      const percentage =
        Math.round((score / questions.length) * 100);

      document.getElementById("score").textContent =
        percentage + "%";


      localStorage.setItem(
        "restaurantBasicsCompleted",
        "true"
      );
    }


    showQuestion();

  </script>

</body>
</html>
