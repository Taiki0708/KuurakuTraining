<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ServeUp - Restaurant Basics</title>

<style>

/* =========================
   BASIC
========================= */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    background: #ffffff;
    color: #374151;
}

.container {
    width: 90%;
    max-width: 900px;
    margin: 0 auto;
    padding: 55px 0 40px;
}


/* =========================
   HEADER
========================= */

.header {
    text-align: center;
    margin-bottom: 55px;
}

.logo {
    font-size: 40px;
    font-weight: 700;
    letter-spacing: 9px;
    color: #374151;
    margin-bottom: 10px;
}

.tagline {
    font-size: 16px;
    color: #9ca3af;
    margin-bottom: 4px;
}

.course-title {
    font-size: 22px;
    color: #6b7280;
}


/* =========================
   PROGRESS
========================= */

.progress {
    font-size: 18px;
    color: #6b7280;
    margin-bottom: 25px;
}


/* =========================
   QUIZ CARD
========================= */

.quiz-card {
    border: 1px solid #e5e7eb;
    border-radius: 18px;
    padding: 35px;
    background: #ffffff;
    box-shadow: 0 3px 12px rgba(0,0,0,0.04);
}

.question {
    font-size: 25px;
    font-weight: 600;
    line-height: 1.4;
    color: #374151;
    margin-bottom: 28px;
}


/* =========================
   ANSWERS
========================= */

.answers {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.answer {
    width: 100%;
    padding: 20px;
    border: 1px solid #ddd;
    border-radius: 14px;
    background: #ffffff;
    text-align: left;
    font-size: 18px;
    color: #374151;
    cursor: pointer;
    transition: 0.2s;
}

.answer:hover {
    background: #f7f7f7;
}

.answer:disabled {
    cursor: default;
}

.answer.correct {
    background: #f3faf5;
    border: 2px solid #b7dfc1;
    color: #5b9b63;
}

.answer.incorrect {
    background: #fdf5f5;
    border: 2px solid #e5b8b8;
    color: #c96b6b;
}


/* =========================
   FEEDBACK
========================= */

.feedback {
    display: none;
    width: 100%;
    margin-top: 24px;
    padding: 24px;
    background: #ffffff;
    border: 1px solid #e5e7eb;
    border-radius: 12px;
}


/* Feedback header */

.feedback-header {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    margin-bottom: 22px;
}


/* Feedback icon */

.feedback-icon {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    color: #ffffff;
    font-size: 17px;
    font-weight: 700;
}

.feedback.correct .feedback-icon {
    background: #59b963;
}

.feedback.incorrect .feedback-icon {
    background: #dc6b6b;
}


/* Correct / Not quite */

.feedback-title {
    font-size: 20px;
    font-weight: 700;
    line-height: 1.3;
    margin: 0;
}

.feedback.correct .feedback-title {
    color: #398b43;
}

.feedback.incorrect .feedback-title {
    color: #b94a4a;
}


/* Feedback text */

#feedbackText {
    width: 100%;
    font-size: 16px;
    font-weight: 400;
    line-height: 1.7;
    color: #374151;
    margin: 0;
}


/* Correct answer */

#correctAnswer {
    margin: 0 0 20px 0;
    font-size: 16px;
    font-weight: 600;
    line-height: 1.6;
    color: #374151;
}


/* Explanation */

#explanation {
    margin: 0;
    font-size: 16px;
    font-weight: 400;
    line-height: 1.7;
    color: #374151;
}


/* =========================
   NEXT BUTTON
========================= */

.next-button {
    width: 100%;
    margin-top: 24px;
    padding: 17px;
    border: none;
    border-radius: 10px;
    background: #465363;
    color: #ffffff;
    font-size: 17px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s ease;
    display: none;
}

.next-button:hover {
    background: #374151;
}


/* =========================
   RESULT
========================= */

.result {
    display: none;
    text-align: center;
    border: 1px solid #e5e7eb;
    border-radius: 18px;
    padding: 55px 35px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.04);
}

.result-small {
    font-size: 16px;
    color: #9ca3af;
    margin-bottom: 10px;
}

.result-title {
    font-size: 34px;
    font-weight: 700;
    margin: 0 0 25px;
    color: #374151;
}

.score {
    font-size: 68px;
    font-weight: 700;
    color: #374151;
    margin-bottom: 15px;
}

.result-message {
    font-size: 16px;
    color: #6b7280;
    line-height: 1.6;
    margin-bottom: 30px;
}

.result-status {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 25px;
}

.passed {
    color: #398b43;
}

.not-passed {
    color: #b94a4a;
}

.try-again {
    display: inline-block;
    padding: 15px 35px;
    border: none;
    border-radius: 10px;
    background: #465363;
    color: #ffffff;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
}


/* =========================
   FOOTER
========================= */

.footer {
    margin-top: 35px;
    font-size: 14px;
    color: #6b7280;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    .container {
        width: 92%;
        padding-top: 35px;
    }

    .logo {
        font-size: 30px;
        letter-spacing: 6px;
    }

    .header {
        margin-bottom: 40px;
    }

    .quiz-card {
        padding: 22px;
    }

    .question {
        font-size: 21px;
    }

    .answer {
        font-size: 15px;
    }

    .feedback {
        padding: 20px;
    }

    .feedback-title {
        font-size: 20px;
    }

    #feedbackText,
    #correctAnswer,
    #explanation {
        font-size: 16px;
    }

    .score {
        font-size: 55px;
    }

}

</style>
</head>


<body>

<div class="container">

    <!-- HEADER -->

    <div class="header">

        <div class="logo">
            SERVEUP
        </div>

        <div class="tagline">
            Restaurant Training Made Simple
        </div>

        <div class="course-title">
            Restaurant Basics
        </div>

    </div>


    <!-- QUIZ -->

    <div id="quiz">

        <div id="progress" class="progress">
            Question 1 / 10
        </div>


        <div class="quiz-card">

            <div id="question" class="question">
            </div>


            <div id="answers" class="answers">
            </div>


            <!-- FEEDBACK -->

            <div id="feedback" class="feedback">

                <div class="feedback-header">

                    <div id="feedbackIcon" class="feedback-icon">
                        ✓
                    </div>

                    <div id="feedbackTitle" class="feedback-title">
                        Correct
                    </div>

                </div>


                <div id="feedbackText">

                    <p id="correctAnswer">
                    </p>

                    <p id="explanation">
                    </p>

                </div>

            </div>


            <!-- NEXT BUTTON -->

            <button id="nextButton" class="next-button">
                Next Question →
            </button>

        </div>

    </div>


    <!-- RESULT -->

    <div id="result" class="result">

        <div class="result-small">
            Training Complete
        </div>

        <h1 id="resultTitle" class="result-title">
            Keep practicing!
        </h1>

        <div id="score" class="score">
            0%
        </div>

        <div id="resultMessage" class="result-message">
        </div>

        <div id="resultStatus" class="result-status">
        </div>

        <button class="try-again" onclick="restartQuiz()">
            Try Again
        </button>

    </div>


    <!-- FOOTER -->

    <div class="footer">
        © 2026 ServeUp
    </div>

</div>


<script>


/* =========================
   QUESTIONS
========================= */

const questions = [

    {
        question: "What is the most important thing when greeting a guest?",

        answers: [
            "Ignore them until they sit down",
            "Greet them warmly and promptly",
            "Ask for payment immediately",
            "Tell them today's specials first"
        ],

        correct: 1,

        explanation:
            "Guests should be welcomed warmly and promptly so they feel comfortable from the beginning."
    },


    {
        question: "What should you do before serving food to a guest?",

        answers: [
            "Check that the table is clean and ready",
            "Leave the food at the entrance",
            "Ask another guest to make space",
            "Serve without checking"
        ],

        correct: 0,

        explanation:
            "A clean and properly prepared table creates a safe and comfortable experience for the guest."
    },


    {
        question: "What is the best way to respond to a guest complaint?",

        answers: [
            "Argue with the guest",
            "Ignore the complaint",
            "Listen carefully and respond calmly",
            "Tell the guest it is not your problem"
        ],

        correct: 2,

        explanation:
            "Listening carefully and responding calmly helps resolve the problem and shows respect for the guest."
    },


    {
        question: "Why is hand washing important in a restaurant?",

        answers: [
            "It makes the hands smell better",
            "It helps prevent the spread of germs",
            "It makes service faster",
            "It is only necessary at the end of the shift"
        ],

        correct: 1,

        explanation:
            "Proper hand washing is one of the most important ways to prevent contamination and protect guests."
    },


    {
        question: "What should you do if you are unsure about a guest's request?",

        answers: [
            "Guess what they want",
            "Ignore the request",
            "Ask a colleague or manager for help",
            "Tell the guest to decide themselves"
        ],

        correct: 2,

        explanation:
            "If you are unsure, ask for help rather than guessing. This reduces mistakes and gives the guest better service."
    },


    {
        question: "What is good table service?",

        answers: [
            "Checking on guests without disturbing them",
            "Never looking at the table",
            "Talking only to other staff",
            "Leaving guests completely alone"
        ],

        correct: 0,

        explanation:
            "Good service means paying attention to guests while giving them enough space to enjoy their meal."
    },


    {
        question: "What should you do when carrying hot food?",

        answers: [
            "Walk quickly without looking",
            "Warn others and handle it carefully",
            "Carry it above guests' heads",
            "Leave it unattended"
        ],

        correct: 1,

        explanation:
            "Hot food should always be handled carefully, and nearby staff should be warned when necessary."
    },


    {
        question: "Why is food temperature important?",

        answers: [
            "Only because it looks better",
            "It helps maintain food quality and safety",
            "It makes the restaurant quieter",
            "It is not important"
        ],

        correct: 1,

        explanation:
            "Keeping food at appropriate temperatures helps maintain quality and reduces food safety risks."
    },


    {
        question: "What should you do if you drop something on the floor?",

        answers: [
            "Put it back immediately",
            "Leave it there",
            "Clean it up and follow restaurant procedures",
            "Hide it under the table"
        ],

        correct: 2,

        explanation:
            "Anything dropped on the floor should be handled according to food safety and cleaning procedures."
    },


    {
        question: "What is the goal of good restaurant service?",

        answers: [
            "Finish the shift as quickly as possible",
            "Make guests feel welcomed, comfortable and cared for",
            "Sell the most expensive items",
            "Avoid speaking to guests"
        ],

        correct: 1,

        explanation:
            "The goal of good service is to create a welcoming, comfortable and positive experience for every guest."
    }

];


let currentQuestion = 0;
let score = 0;
let answered = false;


/* =========================
   SHOW QUESTION
========================= */

function showQuestion() {

    answered = false;

    const q = questions[currentQuestion];


    document.getElementById("progress").textContent =
        "Question " +
        (currentQuestion + 1) +
        " / " +
        questions.length;


    document.getElementById("question").textContent =
        q.question;


    const answersDiv =
        document.getElementById("answers");

    answersDiv.innerHTML = "";


    const feedback =
        document.getElementById("feedback");

    feedback.style.display = "none";


    document.getElementById("nextButton").style.display =
        "none";


    q.answers.forEach(function(answer, index) {

        const button =
            document.createElement("button");


        button.className = "answer";


        button.textContent =
            String.fromCharCode(65 + index) +
            ". " +
            answer;


        button.onclick = function() {

            selectAnswer(index, button);

        };


        answersDiv.appendChild(button);

    });

}


/* =========================
   SELECT ANSWER
========================= */

function selectAnswer(index, button) {

    if (answered) {
        return;
    }


    answered = true;


    const q = questions[currentQuestion];


    const allButtons =
        document.querySelectorAll(".answer");


    allButtons.forEach(function(btn) {

        btn.disabled = true;

    });


    const feedback =
        document.getElementById("feedback");


    const feedbackIcon =
        document.getElementById("feedbackIcon");


    const feedbackTitle =
        document.getElementById("feedbackTitle");


    const correctAnswer =
        document.getElementById("correctAnswer");


    const explanation =
        document.getElementById("explanation");


    /* =========================
       CORRECT
    ========================= */

    if (index === q.correct) {

        score++;


        button.classList.add("correct");


        feedback.className =
            "feedback correct";


        feedbackIcon.textContent =
            "✓";


        feedbackTitle.textContent =
            "Correct";

    }


    /* =========================
       INCORRECT
    ========================= */

    else {

        button.classList.add("incorrect");


        allButtons[q.correct].classList.add("correct");


        feedback.className =
            "feedback incorrect";


        feedbackIcon.textContent =
            "×";


        feedbackTitle.textContent =
            "Not quite";

    }


    /* =========================
       CORRECT ANSWER TEXT
    ========================= */

    correctAnswer.textContent =
        "The correct answer is " +
        String.fromCharCode(65 + q.correct) +
        ". " +
        q.answers[q.correct];


    /* =========================
       EXPLANATION
    ========================= */

    explanation.textContent =
        q.explanation;


    feedback.style.display =
        "block";


    document.getElementById("nextButton").style.display =
        "block";

}


/* =========================
   NEXT QUESTION
========================= */

function nextQuestion() {

    currentQuestion++;


    if (currentQuestion < questions.length) {

        showQuestion();


        window.scrollTo({

            top: 0,

            behavior: "smooth"

        });

    }

    else {

        showResult();

    }

}


/* =========================
   RESULT
========================= */

function showResult() {

    document.getElementById("quiz").style.display =
        "none";


    document.getElementById("result").style.display =
        "block";


    const percentage =
        Math.round(
            (score / questions.length) * 100
        );


    document.getElementById("score").textContent =
        percentage + "%";


    const resultTitle =
        document.getElementById("resultTitle");


    const resultStatus =
        document.getElementById("resultStatus");


    const resultMessage =
        document.getElementById("resultMessage");


    if (percentage >= 80) {

        resultTitle.textContent =
            "Training Complete!";


        resultStatus.textContent =
            "Passed ✓";


        resultStatus.className =
            "result-status passed";


        resultMessage.textContent =
            "You answered " +
            score +
            " out of " +
            questions.length +
            " questions correctly. Great job!";

    }

    else {

        resultTitle.textContent =
            "Keep practicing!";


        resultStatus.textContent =
            "Not Passed ×";


        resultStatus.className =
            "result-status not-passed";


        resultMessage.textContent =
            "You answered " +
            score +
            " out of " +
            questions.length +
            " questions correctly. You need 80% or higher to pass.";

    }

}


/* =========================
   RESTART
========================= */

function restartQuiz() {

    currentQuestion = 0;

    score = 0;

    answered = false;


    document.getElementById("result").style.display =
        "none";


    document.getElementById("quiz").style.display =
        "block";


    showQuestion();


    window.scrollTo({

        top: 0,

        behavior: "smooth"

    });

}


/* =========================
   NEXT BUTTON
========================= */

document.getElementById("nextButton").onclick =
    nextQuestion;


/* =========================
   START
========================= */

showQuestion();

</script>

</body>
</html>
