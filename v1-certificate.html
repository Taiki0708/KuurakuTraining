<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ServeUp | Certificate</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/brand/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="v1.css?v=1.0.0-4">
  <style>
    .certificate{max-width:850px;margin:40px auto;padding:clamp(28px,6vw,70px);border:9px solid #dbe8e0;text-align:center;background:white}
    .certificate h1{font-size:clamp(30px,5vw,45px)}.certificate p{font-size:18px}
    @media print{body{background:white}.no-print{display:none!important}.certificate{margin:0;border-width:7px;min-height:95vh}}
  </style>
</head>
<body>
  <main class="shell">
    <a id="v1CertificateBack" class="no-print" href="v1.html">← Courses</a>
    <p id="status" role="status">Checking certificate…</p>
    <section id="certificate" class="certificate" hidden>
      <img src="assets/brand/serveup-logo.svg" alt="ServeUp" style="width:230px;height:auto;margin:0 auto 24px"><h1>Certificate of Completion</h1><p>This certifies that</p>
      <h2 id="learner"></h2><p>has completed</p><h2 id="course"></h2><p id="issued"></p><p id="number"></p>
      <button type="button" class="no-print" onclick="window.print()">Print / Save as PDF</button>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="environment.js?v=1.0.0-4"></script>
  <script src="supabase-client.js?v=1.0.0-4"></script>
  <script src="v1-store.js?v=1.0.0-4"></script>
  <script>
  (async () => {
    const id = new URLSearchParams(location.search).get('course');
    try {
      const user = await ServeUpProgress.getCurrentUser();
      if (!user) { document.getElementById('status').textContent = 'Please sign in first.'; return; }
      const response = await fetch('data/courses.json', { cache:'no-store' });
      if (!response.ok) throw Error('Course data unavailable');
      const course = (await response.json()).find(item => item.id === id);
      if (!course) throw Error('Unknown course');
      const certificate = await ServeUpV1Store.certificate(user.id, id);
      if (!certificate) { document.getElementById('status').textContent = 'No issued certificate for this course.'; return; }
      const lang = localStorage.getItem('serveupLanguage') || 'en';
      document.getElementById('learner').textContent = user.email;
      document.getElementById('course').textContent = course.title[lang] || course.title.en;
      document.getElementById('issued').textContent = `Issued ${new Date(certificate.issued_at).toLocaleDateString(lang)}`;
      document.getElementById('number').textContent = `Certificate No. ${certificate.certificate_number}`;
      document.getElementById('certificate').hidden = false;
      document.getElementById('status').hidden = true;
    } catch (error) {
      document.getElementById('status').textContent = `Could not verify certificate: ${error.message}`;
    }
  })();
  </script>
  <script src="pwa.js"></script>
</body>
</html>
