<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ServeUp - Customer Service Training</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  background: #f7f6f2;
  color: #222;
}

.container {
  max-width: 760px;
  margin: 0 auto;
  padding: 45px 20px 80px;
}

.logo {
  text-align: center;
  font-size: 46px;
  font-weight: 700;
  letter-spacing: 9px;
  margin-bottom: 8px;
}

.subtitle {
  text-align: center;
  color: #777;
  font-size: 20px;
  margin-bottom: 55px;
}

.progress {
  color: #777;
  font-size: 18px;
  margin-bottom: 25px;
}

.question {
  font-size: 30px;
  line-height: 1.45;
  font-weight: 700;
  margin-bottom: 30px;
}

.option {
  width: 100%;
  background: white;
  border: 1px solid #ddd;
  border-radius: 18px;
  padding: 22px 24px;
  margin-bottom: 16px;
  text-align: left;
  font-size: 19px;
  color: #333;
  cursor: pointer;
  transition: 0.2s;
}

.option:hover {
  background: #f0f0ee;
}

.option.selected {
  background: #e8f4e9;
  border: 2px solid #5caf6a;
}

.next-btn,
.retry-btn {
  width: 100%;
  border: none;
  border-radius: 16px;
  padding: 18px;
  font-size: 19px;
  background: #222;
  color: white;
  cursor: pointer;
  margin-top: 15px;
}

.next-btn:disabled {
  background: #ccc;
  cursor: not-allowed;
}

.result {
  background: white;
  border-radius: 22px;
  padding: 45px 25px;
  text-align: center;
  border: 1px solid #ddd;
}

.result-label {
  color: #777;
  font-size: 20px;
}

.result h1 {
  font-size: 48px;
  margin: 15px 0;
}

.score {
  font-size: 72px;
  font-weight: 700;
  margin: 20px 0;
}

.result-text {
  color: #777;
  font-size: 20px;
  line-height: 1.5;
}

.explanation {
  background: #f7f6f2;
  border-radius: 15px;
  padding: 20px;
  margin-top: 25px;
  text-align: left;
  line-height: 1.6;
}

.hidden {
  display: none;
}

@media (max-width: 600px) {
  .logo {
    font-size: 36px;
    letter-spacing: 7px;
  }

  .question {
    font-size: 25px;
  }

  .option {
    font-size: 18px;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="logo">SERVEUP</div>
  <div class="subtitle">Customer Service Training</div>

  <div id="quiz">

    <div class="progress" id="progress"></div>

    <div class="question" id="question"></div>

    <div id="options"></div>

    <button class="next-btn" id="nextBtn" disabled>
      Next →
    </button>

  </div>

  <div id="result" class="result hidden">

    <div class="result-label">Training Complete</div>

    <h1 id="resultTitle">Well done!</h1>

    <div class="score" id="score"></div>

    <div class="result-text" id="resultText"></div>

    <div class="explanation" id="resultExplanation"></div>

    <button class="retry-btn" onclick="restartQuiz()">
      Try Again
    </button>

  </div>

</div>

<script>

const questions = [

{
  question: "A customer says their food is taking too long. What should you do FIRST?",
  options: [
    "Tell them the kitchen is busy.",
    "Ignore the complaint.",
    "Apologize, listen and check the order.",
    "Tell them to order something else."
  ],
  answer: 2,
  explanation: "First, listen carefully and apologize. Then check the order and take appropriate action."
},

{
  question: "A customer asks you a question and you don't know the answer. What should you do?",
  options: [
    "Guess the answer.",
    "Ignore the customer.",
    "Say you don't know and walk away.",
    "Politely tell them you will check and find the correct answer."
  ],
  answer: 3,
  explanation: "Never guess. Tell the customer you will check and make sure they receive accurate information."
},

{
  question: "What is the best way to greet a customer?",
  options: [
    "Wait until they speak first.",
    "Greet them warmly and make eye contact.",
    "Point to an empty table.",
    "Continue talking to another staff member."
  ],
  answer: 1,
  explanation: "A warm greeting and eye contact create a positive first impression."
},

{
  question: "A customer complains about their food. What should you avoid doing?",
  options: [
    "Listening carefully.",
    "Apologizing.",
    "Arguing with the customer.",
    "Checking what happened."
  ],
  answer: 2,
  explanation: "Do not argue. Listen, apologize and focus on finding a solution."
},

{
  question: "When taking an order, what is especially important?",
  options: [
    "Taking the order as quickly as possible.",
    "Checking and confirming the order.",
    "Talking to another staff member.",
    "Walking away before the customer finishes."
  ],
  answer: 1,
  explanation: "Confirming the order helps prevent mistakes and shows the customer that you are paying attention."
},

{
  question: "A customer looks confused while reading the menu. What should you do?",
  options: [
    "Ignore them.",
    "Tell them to ask another customer.",
    "Offer assistance politely.",
    "Take the menu away."
  ],
  answer: 2,
  explanation: "Good service means noticing when customers need help and offering assistance without being pushy."
},

{
  question: "What should you do after serving food to a table?",
  options: [
    "Immediately leave the area and forget about the table.",
    "Check back appropriately to make sure everything is okay.",
    "Ask them to call another staff member.",
    "Start clearing the table immediately."
  ],
  answer: 1,
  explanation: "A good follow-up helps identify problems early and shows that you care about the customer's experience."
},

{
  question: "A customer becomes upset. What is the best response?",
  options: [
    "Become upset too.",
    "Tell them it is not your problem.",
    "Stay calm, listen and try to help.",
    "Walk away."
  ],
  answer: 2,
  explanation: "Stay calm and professional. Listen to the customer and focus on finding a solution."
},

{
  question: "Why is teamwork important in restaurant service?",
  options: [
    "Because one person should do everything.",
    "Because staff can support each other and provide better service.",
    "Because customers don't notice mistakes.",
    "Because communication is unnecessary."
  ],
  answer: 1,
  explanation: "Good teamwork improves communication, reduces mistakes and creates a smoother experience for customers."
},

{
  question: "What is the most important goal of customer service?",
  options: [
    "Finish work as quickly as possible.",
    "Avoid speaking with customers.",
    "Make the customer feel welcomed, respected and well cared for.",
    "Sell the most expensive items."
  ],
  answer: 2,
  explanation: "Excellent customer service is about making guests feel welcomed, respected and cared for."
}

];

let currentQuestion = 0;
let score = 0;
let selectedAnswer = null;

const progress = document.getElementById("progress");
const question = document.getElementById("question");
const options = document.getElementById("options");
const nextBtn = document.getElementById("nextBtn");

function loadQuestion() {

  selectedAnswer = null;
  nextBtn.disabled = true;

  const q = questions[currentQuestion];

  progress.textContent =
    `Question ${currentQuestion + 1} / ${questions.length}`;

  question.textContent = q.question;

  options.innerHTML = "";

  q.options.forEach((option, index) => {

    const button = document.createElement("button");

    button.className = "option";

    button.textContent =
      `${String.fromCharCode(65 + index)}. ${option}`;

    button.onclick = () => selectAnswer(index, button);

    options.appendChild(button);

  });

}

function selectAnswer(index, button) {

  selectedAnswer = index;

  document.querySelectorAll(".option").forEach(option => {
    option.classList.remove("selected");
  });

  button.classList.add("selected");

  nextBtn.disabled = false;
}

nextBtn.onclick = () => {

  if (selectedAnswer === null) return;

  if (selectedAnswer === questions[currentQuestion].answer) {
    score++;
  }

  currentQuestion++;

  if (currentQuestion < questions.length) {
    loadQuestion();
  } else {
    showResult();
  }

};

function showResult() {

  document.getElementById("quiz").classList.add("hidden");

  document.getElementById("result").classList.remove("hidden");

  const percentage =
    Math.round((score / questions.length) * 100);

  document.getElementById("score").textContent =
    `${percentage}%`;

  document.getElementById("resultText").textContent =
    `You answered ${score} out of ${questions.length} questions correctly.`;

  if (percentage >= 80) {

    document.getElementById("resultTitle").textContent =
      "Well done! ✓";

    document.getElementById("resultExplanation").innerHTML =
      "<strong>Passed!</strong><br><br>" +
      "You have successfully completed the Customer Service Training. " +
      "Keep using these service principles in your daily work.";

  } else {

    document.getElementById("resultTitle").textContent =
      "Keep practicing!";

    document.getElementById("resultExplanation").innerHTML =
      "<strong>Not passed yet.</strong><br><br>" +
      "Review the customer service principles and try again. " +
      "You need 80% or higher to pass.";

  }

}

function restartQuiz() {

  currentQuestion = 0;
  score = 0;
  selectedAnswer = null;

  document.getElementById("result").classList.add("hidden");

  document.getElementById("quiz").classList.remove("hidden");

  loadQuestion();

}

loadQuestion();

</script>

</body>
</html>
