<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ServeUp - Customer Service Training</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7f7f5;
            color: #222;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 35px;
        }

        .logo {
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 7px;
        }

        .subtitle {
            margin-top: 8px;
            color: #777;
            font-size: 16px;
        }

        .progress {
            text-align: center;
            color: #888;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            border-radius: 18px;
            padding: 30px 25px;
            border: 1px solid #e5e5e5;
        }

        .question {
            font-size: 23px;
            line-height: 1.4;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .answer {
            width: 100%;
            padding: 16px;
            margin-bottom: 12px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 12px;
            text-align: left;
            font-size: 16px;
            cursor: pointer;
        }

        .answer:hover {
            background: #f2f2f2;
        }

        .answer.correct {
            background: #e6f5e9;
            border-color: #4caf50;
        }

        .answer.wrong {
            background: #fbeaea;
            border-color: #e57373;
        }

        .feedback {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            background: #f5f5f5;
            line-height: 1.5;
        }

        .next,
        .restart {
            width: 100%;
            margin-top: 20px;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: #222;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .result {
            text-align: center;
        }

        .result h1 {
            margin-bottom: 10px;
        }

        .score {
            font-size: 56px;
            font-weight: bold;
            margin: 20px 0;
        }

        .result p {
            color: #777;
            line-height: 1.6;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <div class="logo">SERVEUP</div>
        <div class="subtitle">Customer Service Training</div>
    </div>

    <div id="quiz"></div>

</div>

<script>

const questions = [

    {
        question: "A customer says their food is taking too long. What should you do first?",
        answers: [
            "Ignore the complaint",
            "Tell them to wait",
            "Apologize, listen and check the order",
            "Blame the kitchen"
        ],
        correct: 2,
        explanation: "Acknowledge the customer's concern, apologize and check the situation promptly."
    },

    {
        question: "A customer asks a question you do not know the answer to. What should you do?",
        answers: [
            "Guess the answer",
            "Ignore the question",
            "Politely say you will check and find the correct information",
            "Tell the customer to ask another staff member"
        ],
        correct: 2,
        explanation: "It is better to check and provide accurate information than to guess."
    },

    {
        question: "You realize that you made a mistake in a customer's order. What should you do?",
        answers: [
            "Hide the mistake",
            "Blame another staff member",
            "Apologize and correct the mistake quickly",
            "Wait until the customer notices"
        ],
        correct: 2,
        explanation: "Take responsibility, apologize and solve the problem as quickly as possible."
    },

    {
        question: "A customer is angry about their experience. What is the best response?",
        answers: [
            "Argue with the customer",
            "Walk away",
            "Stay calm, listen and offer appropriate help",
            "Tell them they are wrong"
        ],
        correct: 2,
        explanation: "Stay calm and listen carefully. Understanding the problem is the first step toward solving it."
    },

    {
        question: "What should you do when a customer is leaving the restaurant?",
        answers: [
            "Say nothing",
            "Turn away immediately",
            "Thank the customer sincerely and say goodbye",
            "Ask them to leave a review"
        ],
        correct: 2,
        explanation: "A warm farewell creates a positive final impression."
    }

];

let currentQuestion = 0;
let score = 0;
let answered = false;

function showQuestion() {

    answered = false;

    const q = questions[currentQuestion];

    document.getElementById("quiz").innerHTML = `

        <div class="progress">
            Question ${currentQuestion + 1} / ${questions.length}
        </div>

        <div class="card">

            <div class="question">
                ${q.question}
            </div>

            <div id="answers">

                ${q.answers.map((answer, index) => `
                    <button
                        class="answer"
                        onclick="selectAnswer(${index})">
                        ${answer}
                    </button>
                `).join("")}

            </div>

            <div id="feedback"></div>

            <button
                id="nextButton"
                class="next"
                onclick="nextQuestion()"
                style="display:none;">
                Next Question →
            </button>

        </div>
    `;
}

function selectAnswer(index) {

    if (answered) return;

    answered = true;

    const q = questions[currentQuestion];

    const buttons =
        document.querySelectorAll(".answer");

    buttons[index].classList.add(
        index === q.correct ? "correct" : "wrong"
    );

    if (index === q.correct) {

        score++;

        document.getElementById("feedback").innerHTML =
            `<div class="feedback">
                <strong>Correct!</strong><br>
                ${q.explanation}
            </div>`;

    } else {

        buttons[q.correct].classList.add("correct");

        document.getElementById("feedback").innerHTML =
            `<div class="feedback">
                <strong>Not quite.</strong><br>
                ${q.explanation}
            </div>`;
    }

    document.getElementById("nextButton").style.display =
        "block";
}

function nextQuestion() {

    currentQuestion++;

    if (currentQuestion >= questions.length) {

        showResult();

    } else {

        showQuestion();

    }
}

function showResult() {

    const percentage =
        Math.round((score / questions.length) * 100);

    document.getElementById("quiz").innerHTML = `

        <div class="card result">

            <div class="progress">
                Training Complete
            </div>

            <h1>Well done!</h1>

            <div class="score">
                ${percentage}%
            </div>

            <p>
                You answered
                <strong>${score}</strong>
                out of
                <strong>${questions.length}</strong>
                questions correctly.
            </p>

            <button
                class="restart"
                onclick="restartTraining()">
                Try Again
            </button>

        </div>
    `;
}

function restartTraining() {

    currentQuestion = 0;
    score = 0;
    answered = false;

    showQuestion();
}

showQuestion();

</script>

</body>
</html>
