<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ServeUp - Customer Service Training</title>

<style>
.feedback-title {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 15px;
}

.feedback-icon {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 18px;
    font-weight: 700;
}

.feedback-icon.correct {
    background: #5b9b63;
}

.feedback-icon.wrong {
    background: #c96b6b;
}
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: #f7f7f5;
        color: #222;
    }

    .container {
        max-width: 900px;
        margin: 0 auto;
        padding: 50px 25px;
    }

    .header {
        text-align: center;
        margin-bottom: 50px;
    }

    .logo {
        font-size: 48px;
        letter-spacing: 10px;
        font-weight: 700;
        margin-bottom: 10px;
    }

    .subtitle {
        font-size: 22px;
        color: #777;
    }

    .progress {
        color: #777;
        font-size: 18px;
        margin-bottom: 25px;
    }

    .question {
        font-size: 30px;
        line-height: 1.4;
        margin-bottom: 30px;
    }

    .answers {
        display: flex;
        flex-direction: column;
        gap: 14px;
    }

    .answer {
        width: 100%;
        padding: 20px;
        border: 1px solid #ddd;
        border-radius: 14px;
        background: white;
        text-align: left;
        font-size: 18px;
        cursor: pointer;
        transition: 0.2s;
    }

    .answer:hover {
        background: #f0f0ee;
    }

    .answer.selected {
        border: 2px solid #555;
    }

    .answer.correct {
        background: #edf7ed;
        border: 2px solid #75a875;
    }

    .answer.wrong {
        background: #fbeeee;
        border: 2px solid #c77;
    }

    .feedback {
        display: none;
        margin-top: 30px;
        padding: 25px;
        background: white;
        border-radius: 16px;
        border: 1px solid #ddd;
    }

    .feedback h3 {
        margin-top: 0;
        font-size: 24px;
    }

    .feedback p {
        font-size: 17px;
        line-height: 1.6;
        color: #555;
    }

    .key-point {
        margin-top: 18px;
        padding: 15px;
        background: #f3f3f1;
        border-radius: 10px;
        font-weight: 600;
    }

    .next-button {
        width: 100%;
        margin-top: 25px;
        padding: 18px;
        border: none;
        border-radius: 12px;
        background: #222;
        color: white;
        font-size: 18px;
        cursor: pointer;
    }

    .next-button:hover {
        background: #444;
    }

    .result {
        display: none;
        text-align: center;
        background: white;
        padding: 45px 25px;
        border-radius: 20px;
        border: 1px solid #ddd;
    }

    .result h2 {
        font-size: 42px;
        margin-bottom: 20px;
    }

    .score {
        font-size: 70px;
        font-weight: 700;
        margin: 20px 0;
    }

    .result p {
        font-size: 19px;
        color: #666;
        line-height: 1.6;
    }

    .retry {
        display: inline-block;
        margin-top: 25px;
        padding: 16px 35px;
        background: #222;
        color: white;
        text-decoration: none;
        border-radius: 10px;
        font-size: 18px;
    }

    @media (max-width: 600px) {
        .container {
            padding: 30px 18px;
        }

        .logo {
            font-size: 36px;
        }

        .question {
            font-size: 24px;
        }

        .answer {
            font-size: 16px;
        }
    }
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <div class="logo">SERVEUP</div>
        <div class="subtitle">Customer Service Training</div>
    </div>

    <div id="quiz">

        <div class="progress" id="progress">
            Question 1 / 10
        </div>

        <h1 class="question" id="question"></h1>

        <div class="answers" id="answers"></div>

        <div class="feedback" id="feedback">

            <h3 id="feedbackTitle"></h3>

            <p id="feedbackText"></p>

            <div class="key-point" id="keyPoint"></div>

        </div>

        <button class="next-button" id="nextButton" onclick="nextQuestion()" style="display:none;">
            Next →
        </button>

    </div>


    <div class="result" id="result">

        <h2 id="resultTitle"></h2>

        <div class="score" id="score"></div>

        <p id="resultMessage"></p>

        <a href="customer-service.html" class="retry">
            Try Again
        </a>

    </div>

</div>


<script>

const questions = [

    {
        question: "A customer says their food is taking too long. What should you do FIRST?",

        answers: [
            "Tell them the kitchen is busy.",
            "Ignore the complaint.",
            "Apologize, listen and check the order.",
            "Tell them to order something else."
        ],

        correct: 2,

        explanation:
        "When a customer is unhappy, the first step is to listen and understand the situation. Apologize politely and check the order status before giving an answer.",

        key:
        "Listen → Apologize → Check → Respond"
    },


    {
        question: "A customer asks a question and you do not know the answer. What should you do?",

        answers: [
            "Guess the answer.",
            "Say you don't know and walk away.",
            "Tell the customer you will check and find the correct answer.",
            "Ignore the question."
        ],

        correct: 2,

        explanation:
        "It is better to check than to give incorrect information. Let the customer know that you will confirm the answer and come back to them.",

        key:
        "Never guess. Check and confirm."
    },


    {
        question: "A customer complains about their food. What is the best response?",

        answers: [
            "Tell them the chef is very busy.",
            "Listen carefully and understand the problem.",
            "Tell them that nobody else complained.",
            "Tell them they should have ordered something else."
        ],

        correct: 1,

        explanation:
        "A complaint should be taken seriously. Listen without interrupting, understand the problem and then look for an appropriate solution.",

        key:
        "Listen first. Solve second."
    },


    {
        question: "What is the best way to greet a customer?",

        answers: [
            "Wait until they speak first.",
            "Greet them politely with a friendly attitude.",
            "Point to an empty table.",
            "Ask immediately what they want to order."
        ],

        correct: 1,

        explanation:
        "The first impression matters. A warm and professional greeting makes customers feel welcome and shows that you are ready to help.",

        key:
        "First impression = Welcome + Smile + Attention"
    },


    {
        question: "A customer is speaking to you. What should you do?",

        answers: [
            "Look at your phone.",
            "Continue another task without listening.",
            "Listen carefully and give them your attention.",
            "Walk away if the restaurant is busy."
        ],

        correct: 2,

        explanation:
        "Customers should feel that they have your attention. Stop unnecessary tasks when possible, listen carefully and respond clearly.",

        key:
        "Give the customer your attention."
    },


    {
        question: "A customer asks for something that is not available. What should you do?",

        answers: [
            "Simply say 'No'.",
            "Ignore the request.",
            "Apologize, explain politely and suggest an alternative.",
            "Tell them to leave."
        ],

        correct: 2,

        explanation:
        "When something is unavailable, avoid making the customer feel rejected. Explain the situation politely and offer another suitable option.",

        key:
        "Explain → Apologize → Offer an alternative"
    },


    {
        question: "A customer becomes angry. What should you do?",

        answers: [
            "Argue with them.",
            "Raise your voice.",
            "Stay calm, listen and try to understand the problem.",
            "Walk away immediately."
        ],

        correct: 2,

        explanation:
        "Staying calm helps prevent the situation from becoming worse. Listen carefully and focus on solving the customer's problem.",

        key:
        "Stay calm. Listen. Solve."
    },


    {
        question: "You notice that a customer has been waiting for assistance. What should you do?",

        answers: [
            "Wait until they call you.",
            "Approach them and offer assistance.",
            "Ignore them.",
            "Ask another customer to help them."
        ],

        correct: 1,

        explanation:
        "Good service means noticing customer needs before they always have to ask. If you see someone waiting, proactively offer assistance.",

        key:
        "Notice → Approach → Assist"
    },


    {
        question: "What should you do after solving a customer's problem?",

        answers: [
            "Walk away immediately.",
            "Check that the customer is satisfied.",
            "Forget about the customer.",
            "Tell them the problem was their fault."
        ],

        correct: 1,

        explanation:
        "After solving a problem, make sure the customer is satisfied. A quick follow-up shows care and professionalism.",

        key:
        "Solve the problem → Follow up → Confirm satisfaction"
    },


    {
        question: "What is the most important attitude in customer service?",

        answers: [
            "Doing only what you are told.",
            "Avoiding difficult customers.",
            "Being attentive, respectful and willing to help.",
            "Serving customers as quickly as possible without listening."
        ],

        correct: 2,

        explanation:
        "Excellent customer service is about more than speed. Customers should feel respected, listened to and genuinely cared for.",

        key:
        "Respect + Attention + Hospitality"
    }

];


let currentQuestion = 0;
let score = 0;
let answered = false;


function loadQuestion() {

    answered = false;

    const q = questions[currentQuestion];

    document.getElementById("progress").textContent =
        "Question " + (currentQuestion + 1) + " / " + questions.length;

    document.getElementById("question").textContent = q.question;

    const answersDiv = document.getElementById("answers");

    answersDiv.innerHTML = "";

    document.getElementById("feedback").style.display = "none";

    document.getElementById("nextButton").style.display = "none";


    q.answers.forEach((answer, index) => {

        const button = document.createElement("button");

        button.className = "answer";

        button.textContent =
            String.fromCharCode(65 + index) + ". " + answer;

        button.onclick = function() {
            selectAnswer(index, button);
        };

        answersDiv.appendChild(button);

    });

}


function selectAnswer(index, selectedButton) {

    if (answered) {
        return;
    }

    answered = true;

    const q = questions[currentQuestion];

    const buttons = document.querySelectorAll(".answer");

    buttons.forEach((button, i) => {

        button.disabled = true;

        if (i === q.correct) {
            button.classList.add("correct");
        }

    });


    if (index === q.correct) {

        score++;

        selectedButton.classList.add("correct");

        document.getElementById("feedbackTitle").innerHTML =
    '<span class="feedback-icon correct">✓</span> Correct!';

    } else {

        selectedButton.classList.add("wrong");

        document.getElementById("feedbackTitle").innerHTML =
    '<span class="feedback-icon wrong">✕</span> Not quite.';

    }


    document.getElementById("feedbackText").textContent =
        q.explanation;

    document.getElementById("keyPoint").textContent =
        "Key point: " + q.key;

    document.getElementById("feedback").style.display =
        "block";

    document.getElementById("nextButton").style.display =
        "block";

}


function nextQuestion() {

    currentQuestion++;

    if (currentQuestion < questions.length) {

        loadQuestion();

    } else {

        showResult();

    }

}


function showResult() {

    document.getElementById("quiz").style.display = "none";

    document.getElementById("result").style.display = "block";

    const percentage =
        Math.round((score / questions.length) * 100);

    document.getElementById("score").textContent =
        percentage + "%";

    if (percentage >= 80) {

localStorage.setItem("customerServiceCompleted", "true");

        document.getElementById("resultTitle").textContent =
            "Well done! ✓";

        document.getElementById("resultMessage").textContent =
            "Passed! You answered " +
            score +
            " out of " +
            questions.length +
            " questions correctly. Keep using these customer service principles in your daily work.";

    } else {

        document.getElementById("resultTitle").textContent =
            "Keep practicing!";

        document.getElementById("resultMessage").textContent =
            "Not passed yet. You answered " +
            score +
            " out of " +
            questions.length +
            " questions correctly. Review the customer service principles and try again. You need 80% or higher to pass.";

    }

}


loadQuestion();

</script>

</body>
</html>
