<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Japanese Hospitality Training</title>
<style>
.feedback-title {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 15px;
}

.feedback-icon {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 18px;
    font-weight: 700;
}

.feedback-icon.correct {
    background: #5b9b63;
}

.feedback-icon.wrong {
    background: #c96b6b;
}
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f7f7f5;
    color: #222;
}

.container {
    max-width: 900px;
    margin: 0 auto;
    padding: 50px 25px;
}

.header {
    text-align: center;
    margin-bottom: 50px;
}

.logo {
    font-size: 48px;
    letter-spacing: 10px;
    font-weight: 700;
    margin-bottom: 10px;
}

.subtitle {
    font-size: 22px;
    color: #777;
}

.progress {
    color: #777;
    font-size: 18px;
    margin-bottom: 25px;
}

.question {
    font-size: 30px;
    font-weight: 600;
    line-height: 1.4;
    margin-bottom: 30px;
}

.option {
    width: 100%;
    padding: 20px;
    border: 1px solid #ddd;
    border-radius: 14px;
    background: white;
    text-align: left;
    font-size: 18px;
    cursor: pointer;
    transition: 0.2s;
    margin-bottom: 14px;
}

.option:hover {
    background: #f0f0ee;
}

.option.correct {
    background: #edf7ed;
    border: 2px solid #75a875;
}

.option.incorrect {
    background: #fbeeee;
    border: 2px solid #c77;
}

.feedback {
    margin-top: 30px;
    padding: 25px;
    background: white;
    border-radius: 16px;
    border: 1px solid #ddd;
    font-size: 17px;
    line-height: 1.6;
    display: none;
}

.next-btn {
    width: 100%;
    margin-top: 25px;
    padding: 18px;
    border: none;
    border-radius: 12px;
    background: #222;
    color: white;
    font-size: 18px;
    cursor: pointer;
    display: none;
}

.result {
    display: none;
    text-align: center;
    background: white;
    padding: 45px 25px;
    border-radius: 20px;
    border: 1px solid #ddd;
}

.result-label {
    font-size: 20px;
    color: #888;
    margin-bottom: 20px;
}

.result h1 {
    font-size: 42px;
    margin-bottom: 20px;
}

.score {
    font-size: 70px;
    font-weight: 700;
    margin: 20px 0;
}

.result-text {
    font-size: 18px;
    color: #666;
    line-height: 1.6;
}

.status {
    background: #f7f7f5;
    border-radius: 14px;
    padding: 25px;
    margin-top: 30px;
    text-align: left;
}

.status h2 {
    font-size: 24px;
    margin-top: 0;
}

.status p {
    font-size: 17px;
    line-height: 1.6;
}

.retry {
    width: 100%;
    background: #222;
    color: white;
    border: none;
    border-radius: 12px;
    padding: 18px;
    margin-top: 25px;
    font-size: 18px;
    cursor: pointer;
}

@media (max-width: 600px) {
    .container {
        padding: 30px 18px;
    }

    .logo {
        font-size: 36px;
    }

    .subtitle {
        font-size: 20px;
    }

    .question {
        font-size: 24px;
    }

    .option {
        font-size: 16px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <div class="logo">SERVEUP</div>
        <div class="subtitle">Japanese Hospitality Training</div>
    </div>

    <div id="quiz">

        <div class="progress" id="progress"></div>

        <div class="question" id="question"></div>

        <div id="options"></div>

        <div class="feedback" id="feedback"></div>

        <button class="next-btn" id="nextBtn" onclick="nextQuestion()">
            Next →
        </button>

    </div>

    <div class="result" id="result">

        <div class="result-label">Training Complete</div>

        <h1 id="resultTitle">Well done!</h1>

        <div class="score" id="score"></div>

        <div class="result-text" id="resultText"></div>

        <div class="status">
            <h2 id="statusTitle"></h2>
            <p id="statusText"></p>
        </div>

        <button class="retry" onclick="restartQuiz()">
            Try Again
        </button>

    </div>

</div>

<script>

const questions = [

{
question: "What is the main idea of Japanese hospitality, or Omotenashi?",
options: [
"Serving customers as quickly as possible",
"Anticipating the customer's needs and providing thoughtful service",
"Giving customers expensive food",
"Ignoring customers unless they ask for help"
],
answer: 1,
explanation: "Omotenashi means providing thoughtful hospitality without expecting anything in return. Staff should try to anticipate what guests may need and make them feel comfortable."
},

{
question: "Which attitude is most important when welcoming a guest?",
options: [
"Looking busy",
"Making the guest wait",
"Warm eye contact, a smile and a polite greeting",
"Only speaking when the guest speaks first"
],
answer: 2,
explanation: "The first impression is very important. A warm greeting, eye contact and a natural smile show the guest that they are welcome."
},

{
question: "A guest looks confused about the menu. What should you do?",
options: [
"Ignore them",
"Tell them to read the menu again",
"Approach politely and offer assistance",
"Ask another customer to help them"
],
answer: 2,
explanation: "Good hospitality means noticing when a guest may need help. Approach politely and offer assistance without making the guest feel uncomfortable."
},

{
question: "What does 'anticipating guest needs' mean?",
options: [
"Waiting until the guest complains",
"Trying to notice what the guest may need before they ask",
"Giving every guest the same service",
"Only focusing on food preparation"
],
answer: 1,
explanation: "Anticipating needs means observing the guest and taking helpful action before they have to ask. For example, offering water when a glass is nearly empty."
},

{
question: "How should you respond when a guest says 'Thank you'?",
options: [
"Ignore them",
"Say nothing",
"Respond politely, such as 'You're welcome'",
"Tell them that it is your job"
],
answer: 2,
explanation: "A polite response keeps the interaction warm and respectful. Simple phrases such as 'You're welcome' or 'My pleasure' help create a positive experience."
},

{
question: "Which behavior best demonstrates respect for a guest?",
options: [
"Interrupting the guest",
"Listening carefully and allowing them to finish speaking",
"Looking at your phone",
"Talking to another staff member while they speak"
],
answer: 1,
explanation: "Respect starts with listening. Give the guest your attention, avoid interrupting and make sure you understand what they are saying."
},

{
question: "A guest complains about their experience. What should you do first?",
options: [
"Argue with the guest",
"Blame another staff member",
"Listen calmly and acknowledge their concern",
"Walk away"
],
answer: 2,
explanation: "When a guest complains, remain calm and listen carefully. Acknowledging their concern shows respect and gives you a chance to understand the problem before solving it."
},

{
question: "What is an important part of Japanese-style service?",
options: [
"Making the service feel forced",
"Being attentive while respecting the guest's personal space",
"Talking constantly to the guest",
"Trying to sell as much as possible"
],
answer: 1,
explanation: "Japanese hospitality balances attentiveness with respect for personal space. Good service should feel natural rather than forced."
},

{
question: "Why is attention to small details important in hospitality?",
options: [
"Small details can make guests feel cared for",
"Guests never notice details",
"It makes the restaurant slower",
"Only managers need to care about details"
],
answer: 0,
explanation: "Small details can strongly influence a guest's experience. Remembering preferences, keeping the table clean and noticing what a guest needs can make the service feel special."
},

{
question: "What is the best goal of Japanese hospitality?",
options: [
"To make the guest spend more money",
"To finish service as quickly as possible",
"To make the guest feel welcomed, respected and cared for",
"To avoid talking to guests"
],
answer: 2,
explanation: "The goal of hospitality is to create a comfortable and positive experience. Guests should feel welcomed, respected and genuinely cared for."
}

];

let currentQuestion = 0;
let score = 0;
let answered = false;

function loadQuestion() {

    answered = false;

    const q = questions[currentQuestion];

    document.getElementById("progress").textContent =
        "Question " + (currentQuestion + 1) + " / " + questions.length;

    document.getElementById("question").textContent = q.question;

    const optionsDiv = document.getElementById("options");
    optionsDiv.innerHTML = "";

    document.getElementById("feedback").style.display = "none";
    document.getElementById("nextBtn").style.display = "none";

    q.options.forEach((option, index) => {

        const button = document.createElement("button");

        button.className = "option";
        button.textContent = String.fromCharCode(65 + index) + ". " + option;

        button.onclick = function() {
            selectAnswer(index, button);
        };

        optionsDiv.appendChild(button);

    });
}

function selectAnswer(selected, clickedButton) {

    if (answered) return;

    answered = true;

    const q = questions[currentQuestion];
    const buttons = document.querySelectorAll(".option");

    buttons.forEach(button => {
        button.disabled = true;
    });

    if (selected === q.answer) {

        score++;

        clickedButton.classList.add("correct");

        document.getElementById("feedback").innerHTML =
    '<div class="feedback-title"><span class="feedback-icon correct">✓</span> Correct!</div>' +
    '<div>' + q.explanation + '</div>';

    } else {

        clickedButton.classList.add("incorrect");

        buttons[q.answer].classList.add("correct");

        document.getElementById("feedback").innerHTML =
    '<div class="feedback-title"><span class="feedback-icon wrong">✕</span> Not quite.</div>' +
    '<div>The correct answer is <strong>' +
    String.fromCharCode(65 + q.answer) +
    '</strong>.<br><br>' +
    q.explanation + '</div>';
    }

    document.getElementById("feedback").style.display = "block";

    if (currentQuestion < questions.length - 1) {
        document.getElementById("nextBtn").style.display = "block";
    } else {
        document.getElementById("nextBtn").textContent = "See Results →";
        document.getElementById("nextBtn").style.display = "block";
    }
}

function nextQuestion() {

    if (currentQuestion < questions.length - 1) {

        currentQuestion++;

        loadQuestion();

    } else {

        showResults();

    }
}

function showResults() {

    const percentage = Math.round((score / questions.length) * 100);

    document.getElementById("quiz").style.display = "none";
    document.getElementById("result").style.display = "block";

    document.getElementById("score").textContent = percentage + "%";

    document.getElementById("resultText").textContent =
        "You answered " + score + " out of " +
        questions.length + " questions correctly.";

    if (percentage >= 80) {

        document.getElementById("resultTitle").textContent = "Well done! ✓";

        document.getElementById("statusTitle").textContent =
            "Passed!";

        document.getElementById("statusText").textContent =
            "You have successfully completed the Japanese Hospitality Training. " +
            "Keep following these food safety principles in your daily work.";

    } else {

        document.getElementById("resultTitle").textContent =
            "Keep practicing!";

        document.getElementById("statusTitle").textContent =
            "Not passed yet.";

        document.getElementById("statusText").textContent =
            "Review the food safety principles and try again. " +
            "You need 80% or higher to pass.";
    }
}

function restartQuiz() {

    currentQuestion = 0;
    score = 0;

    document.getElementById("result").style.display = "none";
    document.getElementById("quiz").style.display = "block";

    document.getElementById("nextBtn").textContent = "Next →";

    loadQuestion();
}

loadQuestion();

</script>

</body>
</html>
