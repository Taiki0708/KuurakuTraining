<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Training | ServeUp</title><link rel="stylesheet" href="serveup.css"><style>.container{max-width:960px;margin:45px auto;padding:0 20px}.card{border:1px solid #e5e7eb;border-radius:14px;padding:22px;margin:20px 0}.list{line-height:2}</style></head><body><main class="container"><a href="index.html" class="home-link">← Back to Home</a><h1>My Training</h1><p id="welcome">Loading…</p><section class="card"><h2>Assigned courses</h2><ul id="assignments" class="list"></ul></section><section class="card"><h2>Completed courses</h2><ul id="completed" class="list"></ul></section><section class="card"><h2>Certificates</h2><ul id="certificates" class="list"></ul></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-client.js"></script><script>(async()=>{const u=await ServeUpProgress.getCurrentUser();if(!u){location.href="auth.html";return}const names={"customer-service":"Customer Service","food-safety":"Food Safety","japanese-hospitality":"Japanese Hospitality","restaurant-basics":"Restaurant Basics"};const [a,p,c]=await Promise.all([ServeUpProgress.getMyAssignments(),ServeUpProgress.getCompletedCourses(),ServeUpProgress.getMyCertificates()]);welcome.textContent=u.email;assignments.innerHTML=a.map(x=>"<li>"+names[x.course_id]+" — "+(x.due_date?"Due "+x.due_date:"No deadline")+"</li>").join("")||"<li>No assignments.</li>";completed.innerHTML=p.map(x=>"<li>"+names[x.course_id]+" — "+x.score+"%</li>").join("")||"<li>No completed courses.</li>";certificates.innerHTML=c.map(x=>'<li><a href="certificate.html?course='+({"customer-service":"customerServiceCompleted","food-safety":"foodSafetyCompleted","japanese-hospitality":"japaneseHospitalityCompleted","restaurant-basics":"restaurantBasicsCompleted"}[x.course_id])+'">'+names[x.course_id]+"</a> — "+x.certificate_number+"</li>").join("")||"<li>No certificates yet.</li>";})()</script></body></html>
