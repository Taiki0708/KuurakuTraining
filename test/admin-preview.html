<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../"><title>ServeUp manager local test preview</title><link rel="stylesheet" href="v1.css"><style>.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.filters label,.form-row label{display:grid;gap:5px}.table-wrap{overflow-x:auto}.report{width:100%;border-collapse:collapse;min-width:900px}.report th,.report td{padding:10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.report th{background:#edf5ef}.form-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:12px 0}.form-row textarea{min-height:44px}.review-row{border-top:1px solid var(--line);padding:16px 0}</style></head><body>
<header class="topbar"><span class="brand">ServeUp TEST</span></header><main class="shell"><h1>Manager dashboard V1</h1><p id="status" role="status">Checking access…</p><div id="content" hidden>
<section class="panel"><h2>Staff progress</h2><div class="filters"><label>Staff<input id="staffFilter" type="search"></label><label>Course<select id="courseFilter"><option value="">All courses</option></select></label><label>Store<select id="storeFilter"><option value="">All stores</option></select></label><label>Role<select id="roleFilter"><option value="">All roles</option></select></label><label>Status<select id="statusFilter"><option value="">All</option><option value="incomplete">Incomplete</option><option value="passed">Quiz passed</option><option value="practical">Practical complete</option></select></label></div><div class="table-wrap"><table class="report"><thead><tr><th>Staff</th><th>Course</th><th>Latest</th><th>Best</th><th>Attempts</th><th>Last learning</th><th>Quiz</th><th>Practical</th><th>Certificate</th><th>Language</th></tr></thead><tbody id="reportRows"></tbody></table></div></section>
<section class="panel"><h2>Practical check</h2><div class="form-row"><label>Staff<select id="learnerSelect"></select></label><label>Course<select id="practicalCourseSelect"></select></label></div><div id="practicalEditor"></div><p id="practicalStatus"></p></section>
<section id="settingsPanel" hidden><form id="settingsForm"><select id="settingsCourse"></select><input id="questionCount"><input id="passScore"><select id="certificateRequirement"><option value="quiz_only">Quiz</option><option value="quiz_and_practical">Both</option></select></form><p id="settingsStatus"></p></section></div></main>
<script>const demoAttempts=[{id:'demo',user_id:'learner-1',course_id:'restaurant-orientation',score:90,passed:true,completed_at:new Date().toISOString(),question_ids:[],answers:{}}];const demoPractical=[];window.ServeUpProgress={client:{},getCurrentUser:async()=>({id:'manager-1'}),getMyRole:async()=>'admin',isPlatformAdmin:async()=>false,getAdminLearners:async()=>[{user_id:'learner-1',email:'learner@example.invalid',store_name:'Kuuraku Test',job_role:'Server'},{user_id:'learner-2',email:'newstaff@example.invalid',store_name:'Kuuraku Test',job_role:'Kitchen'}]};window.ServeUpV1Store={managerAttempts:async()=>demoAttempts,managerPracticals:async()=>demoPractical,managerCertificates:async()=>[],managerLanguages:async()=>[{user_id:'learner-1',locale:'ja'}],settings:async()=>[],savePractical:async(user_id,course_id,item_id,status,comment)=>{const i=demoPractical.findIndex(x=>x.user_id===user_id&&x.course_id===course_id&&x.item_id===item_id);const row={user_id,course_id,item_id,status,comment,reviewer_id:'manager-1',reviewed_at:new Date().toISOString()};if(i<0)demoPractical.push(row);else demoPractical[i]=row}};</script><script src="v1-admin.js"></script></body></html>
