<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../"><title>ServeUp local test preview</title><link rel="stylesheet" href="v1.css"></head><body>
<header class="topbar"><a class="brand" href="v1.html">ServeUp TEST</a><nav><a id="allCoursesLink">Courses</a><a id="myTrainingLink">My training</a><a id="adminLink" hidden>Manager</a></nav></header>
<main class="shell"><div class="toolbar"><label for="locale">Language</label><select id="locale"><option value="en">English</option><option value="ja">日本語</option><option value="hi">हिन्दी</option></select></div><div id="message" class="message" role="status"></div>
<section id="dashboard" hidden><h1 id="dashboardTitle"></h1><p id="dashboardLead"></p><div class="summary"><div class="summary-card"><strong id="completion"></strong><span id="completionLabel"></span></div><div class="summary-card"><strong id="completionRate"></strong><span id="rateLabel"></span></div></div><div id="courseCards" class="course-grid"></div></section>
<section id="courseView" hidden><a id="backLink" href="test/preview.html"></a><h1 id="courseTitle"></h1><p id="courseDescription"></p><div class="summary"><div class="summary-card"><strong id="latestScore"></strong><span id="latestLabel"></span></div><div class="summary-card"><strong id="bestScore"></strong><span id="bestLabel"></span></div><div class="summary-card"><strong id="attemptCount"></strong><span id="attemptLabel"></span></div></div><p id="courseStatus" class="message"></p><div class="actions"><button id="startButton"></button><button id="reviewButton" class="secondary"></button></div><section id="quizPanel" class="panel" hidden><p id="quizProgress"></p><h2 id="questionText"></h2><div id="answerButtons" class="answers"></div><div id="feedback" class="feedback" hidden></div><button id="nextButton" hidden></button></section><section id="resultPanel" class="panel" hidden><h2 id="resultTitle"></h2><p id="resultText"></p><button id="retryButton"></button><button id="resultReviewButton"></button></section><section id="reviewPanel" class="panel" hidden><h2 id="reviewTitle"></h2><div id="reviewItems"></div></section><section class="panel"><h2 id="practicalTitle"></h2><p id="practicalSummary"></p><ul id="practicalItems" class="practical-list"></ul></section><section class="panel"><h2 id="certificateTitle"></h2><p id="certificateStatus"></p><a id="certificateLink" hidden></a></section></section></main>
<script>window.ServeUpProgress={getCurrentUser:async()=>({id:'local-test-user',email:'test@example.invalid'}),getMyRole:async()=> 'learner'};const k=(kind,u,c)=>`test-v1-${kind}-${u}-${c}`;window.ServeUpV1Store={settings:async()=>[],saveLanguage:async()=>{},session:async(u,c)=>JSON.parse(localStorage.getItem(k('session',u,c))||'null'),saveSession:async(u,c,s)=>{const state={...s,updatedAt:new Date().toISOString()};localStorage.setItem(k('session',u,c),JSON.stringify(state));return{state,synced:false}},clearSession:async(u,c)=>localStorage.removeItem(k('session',u,c)),attempts:async(u,c)=>JSON.parse(localStorage.getItem(k('attempts',u,c))||'[]'),saveAttempt:async(u,c,s,r)=>{const row={id:crypto.randomUUID(),user_id:u,course_id:c,question_ids:s.questionIds,answers:s.answers,score:r.score,passed:r.passed,completed_at:new Date().toISOString()};const key=k('attempts',u,c);localStorage.setItem(key,JSON.stringify([row,...JSON.parse(localStorage.getItem(key)||'[]')]));return{row,synced:false}},practical:async()=>[],certificate:async()=>null,issueCertificate:async()=>{throw Error('Test preview only')}};</script>
<script src="quiz-core.js"></script><script src="v1.js"></script></body></html>
